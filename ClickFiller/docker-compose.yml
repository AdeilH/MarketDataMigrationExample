services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: click-filler-clickhouse
    # Optional: only needed on machines without a host-installed
    # ClickHouse. Published on 8124/9001 so it can run next to a host
    # server on the default ports; point click-filler at it with
    # `--ch-host 127.0.0.1 --ch-port 8124 --ch-pass clickhouse-password`.
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=clickhouse-password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  clickhouse-data:
  clickhouse-logs:
